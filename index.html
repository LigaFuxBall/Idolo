<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Ídolo - Liga FuxBall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1730;
    --panel:rgba(15,26,48,0.55);
    --panel-2:rgba(8,15,28,0.6);
    --edge:rgba(255,255,255,0.10);
    --text:#F3F6FB;
    --text-dim:#9FB0C7;
    --yellow:#F6C443;
    --yellow-dim:#D9A62A;
    --blue:#2C57D6;
    --green:#33D17E;
    --red:#F0567A;
    --gray:#6B7A93;
    --line:rgba(255,255,255,0.08);
    --line-strong:rgba(255,255,255,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 70% 45% at 15% 0%, rgba(52,211,153,0.35) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 15%, rgba(44,87,214,0.35) 0%, transparent 60%),
      radial-gradient(ellipse 70% 60% at 50% 100%, rgba(99,60,180,0.30) 0%, transparent 65%),
      radial-gradient(ellipse 50% 40% at 80% 80%, rgba(20,184,166,0.25) 0%, transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 18px;}
  .masthead{padding:32px 18px 10px;display:flex;justify-content:center;}
  .logo-mark{
    width:96px;height:96px;display:flex;align-items:center;justify-content:center;gap:5px;flex-shrink:0;
  }
  .logo-mark span{width:10px;height:46px;background:var(--yellow);transform:skewX(-14deg);}
  .logo-mark img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,0.45));}
  .tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--yellow);margin-top:6px;}

  nav.tabs{
    display:flex;gap:0;margin-top:14px;background:var(--panel-2);border:1px solid var(--edge);border-radius:12px;
    padding:4px;backdrop-filter:blur(14px);
  }
  nav.tabs button{
    flex:1;background:none;border:none;color:var(--text-dim);
    font-family:'Archivo Black',sans-serif;font-size:13px;letter-spacing:0.5px;text-transform:uppercase;
    padding:11px 6px;cursor:pointer;border-radius:9px;
    transition:all .15s ease;
  }
  nav.tabs button.active{color:#0b1730;background:var(--yellow);}
  nav.tabs button:hover:not(.active){color:var(--text);}

  main{padding-top:18px;}
  .card{
    background:var(--panel);color:var(--text);
    border:1px solid var(--edge);
    border-radius:14px;padding:16px 18px;margin-bottom:12px;
    box-shadow:0 12px 32px rgba(0,0,0,0.35);
    backdrop-filter:blur(16px);
    position:relative;
  }
  .card.rust{border-color:rgba(240,86,122,0.4);}
  .card h2{font-family:'Archivo Black',sans-serif;font-size:22px;letter-spacing:0.3px;margin:0 0 5px;color:var(--text);text-transform:uppercase;line-height:1.15;}
  .card h2::before{content:'/// ';color:var(--yellow);}
  .card h3{font-family:'Archivo Black',sans-serif;font-size:13px;letter-spacing:0.8px;text-transform:uppercase;margin:14px 0 7px;color:var(--yellow);}
  .muted{color:var(--text-dim);font-size:13.5px;}
  .empty{
    border:1px dashed var(--line-strong);border-radius:12px;padding:28px 18px;text-align:center;color:var(--text-dim);
  }
  .empty .big{font-family:'Archivo Black',sans-serif;font-size:18px;color:var(--text);margin-bottom:6px;text-transform:uppercase;}

  label{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin:10px 0 5px;}
  input[type=text], select{
    width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;
    font-family:'Inter',sans-serif;font-size:16.5px;font-weight:600;background:#141e30;color:var(--text);
  }
  input[type=text]::placeholder{color:var(--text-dim);font-weight:400;}
  select option{background:#141e30;color:var(--text);}
  input[type=color]{width:46px;height:38px;border:1px solid var(--line-strong);border-radius:8px;padding:2px;background:rgba(255,255,255,0.06);cursor:pointer;}
  input[type=file]{color:var(--text-dim);font-family:'Inter',sans-serif;font-size:12px;max-width:180px;}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  .row > div{flex:1;min-width:140px;}

  .btn{
    font-family:'Archivo Black',sans-serif;letter-spacing:0.3px;font-size:13px;text-transform:uppercase;
    background:rgba(255,255,255,0.08);color:var(--text);border:1px solid var(--line-strong);border-radius:9px;
    padding:11px 18px;cursor:pointer;transition:transform .1s ease, background .15s ease;
  }
  .btn:hover{background:rgba(255,255,255,0.14);}
  .btn:active{transform:scale(0.98);}
  .btn.gold{background:var(--yellow);color:#241a02;border-color:var(--yellow);}
  .btn.gold:hover{background:var(--yellow-dim);}
  .btn.rust{background:var(--red);color:#2b0512;border-color:var(--red);}
  .btn.rust:hover{background:#d43e63;}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-strong);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

  .team-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .team-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(255,255,255,0.05);border:1px solid var(--edge);border-radius:10px;}
  .swatch{width:16px;height:16px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,0.2);}
  .badge{width:28px;height:28px;border-radius:50%;flex-shrink:0;object-fit:cover;border:1px solid var(--line-strong);background:rgba(255,255,255,0.06);}
  .badge-fallback{
    width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Black',sans-serif;font-size:10px;color:#fff;border:1px solid rgba(255,255,255,0.2);
  }
  .team-row .name{font-weight:700;flex:1;}
  .team-row .strength{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);}
  .team-row button{background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;font-family:'JetBrains Mono',monospace;}
  .badge-upload-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--yellow);cursor:pointer;text-decoration:underline;}

  /* Player ID card */
  .idcard{
    background:var(--panel);
    border:1px solid var(--edge);border-radius:16px;padding:0;overflow:hidden;backdrop-filter:blur(16px);
  }
  .idcard-top{
    display:flex;align-items:center;gap:16px;padding:18px 20px;
    border-bottom:1px solid var(--edge);
  }
  .idcard-number{
    font-family:'Archivo Black',sans-serif;font-size:44px;line-height:1;
    color:#241a02;width:68px;height:68px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    background:var(--yellow);
  }
  .idcard-number img.badge-full{width:100%;height:100%;border-radius:16px;object-fit:cover;}
  .idcard-info{flex:1;}
  .idcard-info .pname{font-family:'Archivo Black',sans-serif;font-size:20px;letter-spacing:0.3px;line-height:1.1;color:var(--text);text-transform:uppercase;}
  .idcard-info .pmeta{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);margin-top:6px;}
  .idcard-rating{
    font-family:'Archivo Black',sans-serif;font-size:28px;color:#0b1730;text-align:center;
    background:var(--green);border-radius:10px;padding:8px 12px;min-width:58px;
  }
  .idcard-rating small{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;padding:16px 20px;}
  .stat{font-family:'JetBrains Mono',monospace;font-size:12px;}
  .stat .label{display:flex;justify-content:space-between;margin-bottom:4px;color:var(--text-dim);}
  .bar{height:6px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;}
  .bar > div{height:100%;background:var(--yellow);border-radius:4px;}
  .meters{padding:0 20px 18px;display:flex;gap:18px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);}
  .meters .m{flex:1;}

  .ledger{padding:0 20px 18px;}
  .ledger-row{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12px;padding:7px 0;border-bottom:1px solid var(--edge);}
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row .age{color:var(--yellow);width:34px;}
  .ledger-row .detail{flex:1;padding:0 8px;color:var(--text-dim);}
  .ledger-row .num{font-weight:700;color:var(--text);}

  .option-btn{
    display:block;width:100%;text-align:left;background:rgba(255,255,255,0.05);border:1px solid var(--edge);
    border-radius:12px;padding:10px 12px;margin-bottom:7px;cursor:pointer;font-family:'Inter',sans-serif;
    font-size:14.5px;color:var(--text);transition:border-color .15s ease, background .15s ease;
  }
  .option-btn:hover{border-color:var(--yellow);background:rgba(246,196,67,0.08);}
  .option-btn b{display:block;margin-bottom:0;color:var(--text);font-size:16px;}

  .outcome{
    background:rgba(255,255,255,0.05);border-left:3px solid var(--yellow);padding:12px 14px;margin-top:10px;font-size:14px;font-style:italic;color:var(--text-dim);border-radius:0 8px 8px 0;
  }

  .tier-badge{
    display:inline-block;font-family:'Archivo Black',sans-serif;font-size:11px;letter-spacing:0.5px;text-transform:uppercase;
    padding:4px 11px;border-radius:20px;background:var(--yellow);color:#241a02;
  }

  .lb-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--edge);}
  .lb-row:last-child{border-bottom:none;}
  .lb-pos{font-family:'Archivo Black',sans-serif;font-size:16px;width:26px;color:var(--text-dim);}
  .lb-name{flex:1;}
  .lb-name b{display:block;color:var(--text);}
  .lb-name span{font-size:12px;color:var(--text-dim);}
  .lb-score{font-family:'JetBrains Mono',monospace;font-weight:700;text-align:right;color:var(--yellow);}

  .footerlinks{text-align:center;margin-top:24px;}
  .footerlinks button{background:none;border:none;color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:11px;text-decoration:underline;cursor:pointer;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel-2);color:var(--text);padding:10px 18px;border-radius:20px;
    font-family:'JetBrains Mono',monospace;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,0.5);
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:50;
    border:1px solid var(--line-strong);backdrop-filter:blur(10px);
  }
  .toast.show{opacity:1;}
  .spinner-row{display:flex;align-items:center;gap:14px;justify-content:center;padding:14px 4px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:13px;}
  .spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,0.12);border-top-color:var(--yellow);animation:spin 0.8s linear infinite;flex-shrink:0;}
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* efectos de luz suaves en botones */
  .btn, .option-btn, nav.tabs button, .team-row button, .badge-upload-label{
    transition:box-shadow .22s ease, transform .12s ease, background .22s ease, color .18s ease;
  }
  .btn:hover:not(:disabled){ box-shadow:0 0 0 1px rgba(246,196,67,0.5) inset, 0 4px 18px rgba(246,196,67,0.20); transform:translateY(-1px); }
  .btn.gold{ position:relative; overflow:hidden; }
  .btn.gold::after{
    content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,0.55), transparent);
    transform:skewX(-20deg); transition:left .55s ease;
  }
  .btn.gold:hover::after{ left:130%; }
  .btn.gold:hover{ box-shadow:0 4px 22px rgba(246,196,67,0.45); }
  .btn:active{ transform:scale(0.97) translateY(0); }
  nav.tabs button.active{ box-shadow:0 0 18px rgba(246,196,67,0.4); }
  .option-btn:hover{ box-shadow:0 0 16px rgba(246,196,67,0.22); transform:translateY(-1px); }
  .lb-row, .team-row, .card{ transition:box-shadow .2s ease; }

  /* ===== transición rápida entre pantallas de fase ===== */
  .phase-in{ animation:phaseIn .28s ease both; }
  @keyframes phaseIn{ from{ opacity:0; transform:scale(0.97) translateY(4px); } to{ opacity:1; transform:scale(1) translateY(0); } }

  /* ===== dossier del jugador ===== */
  .dossier{background:var(--panel);border:1px solid var(--edge);border-radius:16px;overflow:hidden;backdrop-filter:blur(16px);margin-bottom:12px;}
  .dossier-top{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 12px;}
  .dossier-rating{font-family:'Archivo Black',sans-serif;font-size:40px;color:var(--yellow);line-height:1;min-width:56px;}
  .dossier-id{flex:1;min-width:0;}
  .dossier-name{font-family:'Archivo Black',sans-serif;font-size:18px;text-transform:uppercase;color:var(--text);letter-spacing:0.3px;}
  .dossier-meta{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-dim);margin-top:3px;letter-spacing:0.5px;}
  .dossier-league{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--green);margin-top:2px;letter-spacing:0.5px;}
  .dossier-crest{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .dossier-crest .badge-fallback{width:42px;height:42px;font-size:14px;}
  .dossier-crest img.badge.dossier-badge{width:52px;height:52px;border-radius:0;object-fit:contain;border:none;background:transparent;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.4));}
  .dossier-retire{background:none;border:1px solid var(--line-strong);border-radius:8px;color:var(--red);font-size:13px;cursor:pointer;padding:3px 7px;font-family:'JetBrains Mono',monospace;}
  .dossier-retire:disabled{opacity:0.25;cursor:not-allowed;}
  .dossier-stats-row, .dossier-attrs-row, .dossier-extra-row{display:grid;gap:6px;padding:0 16px 10px;}
  .dossier-stats-row{grid-template-columns:repeat(4,1fr);}
  .dossier-attrs-row{grid-template-columns:repeat(5,1fr);}
  .dossier-extra-row{grid-template-columns:1fr 1fr;}
  .stat-box{background:rgba(255,255,255,0.045);border:1px solid var(--edge);border-radius:9px;padding:7px 3px;text-align:center;}
  .stat-box .n{font-family:'Archivo Black',sans-serif;font-size:21px;color:var(--text);}
  .stat-box .l{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.4px;color:var(--text-dim);text-transform:uppercase;margin-top:1px;}
  .attr-box{background:rgba(255,255,255,0.045);border:1px solid var(--edge);border-radius:9px;padding:6px 2px;text-align:center;}
  .attr-box.top{border-color:var(--yellow);background:rgba(246,196,67,0.12);}
  .attr-box .n{font-family:'Archivo Black',sans-serif;font-size:18px;color:var(--text);}
  .attr-box.top .n{color:var(--yellow);}
  .attr-box .l{font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:0.3px;color:var(--text-dim);text-transform:uppercase;margin-top:1px;}
  .value-box{background:rgba(255,255,255,0.045);border:1px solid var(--edge);border-radius:9px;padding:8px;text-align:center;}
  .value-box .n{font-family:'Archivo Black',sans-serif;font-size:18px;}
  .value-box .n.money{color:#5fd0ff;}
  .value-box .n.rival{color:var(--text);}
  .value-box .l{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.3px;color:var(--text-dim);text-transform:uppercase;margin-top:2px;}
  .dossier-idolatria{padding:2px 16px 12px;}
  .idolatria-caption{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px;}
  .idolatria-caption b{color:var(--yellow);}
  .idol-track{height:7px;border-radius:5px;background:rgba(255,255,255,0.08);overflow:hidden;}
  .idol-fill{height:100%;background:linear-gradient(90deg,var(--yellow),#ffe08a);border-radius:5px;transition:width .3s ease;}
  .dossier-footer{text-align:center;padding:0 16px 14px;}
  .dossier-footer button{background:none;border:none;color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;text-decoration:underline;}
  .dossier-transfer-btn{display:block;margin:0 16px 12px;text-align:center;}

  /* ===== dado / pretemporada ===== */
  .dice-shake{font-size:60px;display:inline-block;animation:diceShake .12s ease-in-out infinite;}
  @keyframes diceShake{0%{transform:rotate(-10deg) scale(1);}50%{transform:rotate(10deg) scale(1.06);}100%{transform:rotate(-10deg) scale(1);}}

  /* ===== minijuego: 4 en línea ===== */
  .c4-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px;max-width:340px;margin-left:auto;margin-right:auto;}
  .c4-cell{aspect-ratio:1;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid var(--edge);
    display:flex;align-items:center;justify-content:center;font-family:'Archivo Black',sans-serif;font-size:20px;cursor:pointer;color:var(--text);}
  .c4-cell:disabled{cursor:default;}
  .c4-cell.x{color:#8fb2ff;}
  .c4-cell.o{color:var(--red);}
  .c4-cell.hint{border-color:var(--yellow);box-shadow:0 0 10px rgba(246,196,67,0.45);}

  /* ===== minijuego: Simón dice ===== */
  .simon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px;max-width:320px;margin-left:auto;margin-right:auto;}
  .simon-tile{aspect-ratio:1;border-radius:10px;border:2px solid rgba(255,255,255,0.15);cursor:pointer;
    transition:transform .1s ease, box-shadow .15s ease, filter .1s ease;}
  .simon-tile.active{transform:scale(0.92);box-shadow:0 0 22px rgba(255,255,255,0.7);border-color:#fff;filter:brightness(1.5);}

  /* ===== tarjetas de mejora (3 caminos) ===== */
  .upgrade-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px;}
  .upgrade-card{
    position:relative;overflow:hidden;text-align:left;cursor:pointer;
    background:rgba(255,255,255,0.04);border:1px solid var(--edge);border-radius:12px;padding:12px 10px 10px;
    display:flex;flex-direction:column;gap:5px;min-height:120px;color:var(--text);font-family:'Inter',sans-serif;
  }
  .upgrade-card:hover{border-color:var(--yellow);transform:translateY(-2px);box-shadow:0 8px 22px rgba(246,196,67,0.18);}
  .upgrade-rarity{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:20px;align-self:flex-start;}
  .upgrade-card.comun .upgrade-rarity{background:rgba(255,255,255,0.1);color:var(--text-dim);}
  .upgrade-card.rara .upgrade-rarity{background:rgba(44,87,214,0.25);color:#8fb2ff;}
  .upgrade-card.mitica .upgrade-rarity{background:rgba(246,196,67,0.25);color:var(--yellow);}
  .upgrade-card.mitica{border-color:rgba(246,196,67,0.5);box-shadow:0 0 24px rgba(246,196,67,0.15);}
  .upgrade-bg{position:absolute;right:-6px;bottom:-18px;font-family:'Archivo Black',sans-serif;font-size:52px;color:rgba(255,255,255,0.05);letter-spacing:1px;pointer-events:none;}
  .upgrade-title{font-family:'Archivo Black',sans-serif;font-size:16px;text-transform:uppercase;line-height:1.12;color:var(--text);}
  .upgrade-desc{display:none;}
  .upgrade-gain{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--green);font-weight:700;}

  /* ===== eventos: "pasan cosas" ===== */
  .event-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--yellow);margin-bottom:4px;}
  .event-title{font-family:'Archivo Black',sans-serif;font-size:23px;text-transform:uppercase;line-height:1.08;margin-bottom:6px;}
  .event-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:12px;}
  .event-option{
    text-align:left;cursor:pointer;background:rgba(255,255,255,0.04);border:1px solid var(--edge);border-radius:12px;
    padding:12px;color:var(--text);font-family:'Inter',sans-serif;
  }
  .event-option:hover{border-color:var(--yellow);background:rgba(246,196,67,0.06);}
  .event-option b{display:block;font-family:'Archivo Black',sans-serif;font-size:15px;text-transform:uppercase;margin-bottom:4px;letter-spacing:0.2px;line-height:1.15;}

  .market-card .mk-top{display:flex;align-items:center;gap:8px;}
  .market-card .mk-name{font-family:'Archivo Black',sans-serif;font-size:16px;text-transform:uppercase;line-height:1.15;}
  .market-card .mk-league{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);}
  .market-card .mk-salary{font-family:'Archivo Black',sans-serif;font-size:21px;color:var(--green);margin-top:2px;}
  .market-card .mk-salary small{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);font-weight:normal;text-transform:none;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

<body>
<div class="masthead">
  <div class="logo-mark" id="logoMark"><span></span><span></span><span></span></div>
</div>

<div class="wrap">
  <div id="storageWarning"></div>
  <nav class="tabs">
    <button data-tab="liga" id="tabLigaBtn" onclick="setTab('liga')" style="display:none;">LIGA</button>
    <button data-tab="carrera" onclick="setTab('carrera')">MI CARRERA</button>
    <button data-tab="ranking" onclick="setTab('ranking')">RANKING</button>
  </nav>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= STATE ================= */
let league = { name: 'Mi Liga', teams: [], pin: '', logo: null };
let career = null; // active career object or null
let history = [];  // this user's past retired careers
let leaderboard = [];
let tab = 'liga';
let unlockedForEdit = false; // se resetea al recargar la página, salvo que se ingrese la clave de nuevo
const isAdmin = new URLSearchParams(window.location.search).get('admin') === '1';
let uiPhase = 'idle'; // for career flow: idle | training | event | summary | done
let pendingEvent = null;
let lastOutcome = '';

const POSITIONS = [
  {v:'DEL', l:'Delantero'},
  {v:'MED', l:'Mediocampista'},
  {v:'DEF', l:'Defensor'},
];
const FEET = [{v:'derecha',l:'Derecha'},{v:'izquierda',l:'Izquierda'},{v:'ambidiestro',l:'Ambidiestro'}];

/* ================= CONFIG ================= */
// Pegá acá la URL de tu Google Apps Script (paso 2 de la guía). Termina en /exec
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyrd5OLGilDFzTWqOaNG0bF_-UIfK5ysIHD-0K9jWRrjgGpEeBM40AbZTsdjLgRaBtx/exec';

/* ================= STORAGE HELPERS =================
   Lo COMPARTIDO (equipos, ranking) vive en tu Google Sheet.
   Lo PERSONAL (tu carrera activa, tu historial) vive en el navegador de cada uno. */
async function remoteGet(key){
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=get&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    return data.value != null ? data.value : null;
  }catch(e){ console.error('remoteGet', e); return null; }
}
async function remoteSet(key, value){
  try{
    await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'set', key, value})
    });
    return true;
  }catch(e){ console.error('remoteSet', e); return false; }
}
async function remoteDelete(key){
  try{
    await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'delete', key})
    });
    return true;
  }catch(e){ return false; }
}
async function remoteList(prefix){
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=list&prefix=${encodeURIComponent(prefix)}`);
    const data = await res.json();
    return data.keys || [];
  }catch(e){ console.error('remoteList', e); return []; }
}

function localGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function localSet(key, value){ try{ localStorage.setItem(key, value); }catch(e){} }
function localDelete(key){ try{ localStorage.removeItem(key); }catch(e){} }
function localListPrefix(prefix){ try{ return Object.keys(localStorage).filter(k=>k.indexOf(prefix)===0); }catch(e){ return []; } }

function safeParse(str, fallback){
  try{ return JSON.parse(str); }catch(e){ return fallback; }
}
async function loadLeague(){
  const metaRaw = await remoteGet('league-meta');
  const meta = metaRaw ? safeParse(metaRaw, {}) : {};
  league.name = meta.name || 'Mi Liga';
  league.pin = meta.pin || '';
  league.logo = meta.logo || null;
  const teamKeys = await remoteList('team:');
  const teamVals = await Promise.all(teamKeys.map(k=>remoteGet(k)));
  league.teams = teamVals.filter(Boolean).map(v=>safeParse(v,null)).filter(Boolean);
}
async function saveLeagueMeta(){
  await remoteSet('league-meta', JSON.stringify({name:league.name, pin:league.pin, logo:league.logo}));
}
async function saveTeam(team){
  await remoteSet('team:'+team.id, JSON.stringify(team));
}
async function deleteTeamRemote(id){
  await remoteDelete('team:'+id);
}
async function saveLeague(){
  // Guarda TODO de una: nombre/logo/clave + cada equipo. Se usa para altas masivas (seed / importar).
  await saveLeagueMeta();
  for(const t of league.teams){ await saveTeam(t); }
}

function careerStatsValid(c){
  return c && c.stats && c.rival && c.startYear && STAT_KEYS.every(k=>typeof c.stats[k]==='number' && !isNaN(c.stats[k]));
}
async function loadActiveCareer(){
  const raw = localGet('active-career');
  const parsed = raw ? safeParse(raw,null) : null;
  if(parsed && !careerStatsValid(parsed)){
    localDelete('active-career');
    career = null;
  } else {
    career = parsed;
  }
}
async function saveActiveCareer(){ if(career) localSet('active-career', JSON.stringify(career)); }
async function clearActiveCareer(){ career = null; localDelete('active-career'); }

async function loadHistory(){
  const keys = localListPrefix('history:');
  const raw = keys.map(k=>({k, v:localGet(k)})).filter(x=>x.v);
  history = [];
  raw.forEach(({k,v})=>{
    const entry = safeParse(v,null);
    if(entry && !isNaN(entry.score)){ history.push(entry); } else { localDelete(k); }
  });
  history.sort((a,b)=>b.timestamp-a.timestamp);
}
async function saveHistoryEntry(entry){
  localSet('history:'+entry.id, JSON.stringify(entry));
}

async function loadLeaderboard(){
  const keys = await remoteList('leaderboard:');
  const vals = await Promise.all(keys.map(k=>remoteGet(k)));
  leaderboard = [];
  keys.forEach((k,i)=>{
    const v = vals[i];
    if(!v) return;
    const entry = safeParse(v,null);
    if(entry && !isNaN(entry.score)){ leaderboard.push(entry); }
    else if(isAdmin){ remoteDelete(k); } // limpia entradas viejas rotas si estás en modo admin
  });
  leaderboard.sort((a,b)=>b.score-a.score);
}
async function saveLeaderboardEntry(entry){
  await remoteSet('leaderboard:'+entry.id, JSON.stringify(entry));
}

/* ================= UTIL ================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function randRange(min,max){ return Math.random()*(max-min)+min; }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function choice(arr){ return arr[randInt(0,arr.length-1)]; }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}
function posLabel(v){ return (POSITIONS.find(p=>p.v===v)||{}).l || v; }
function posShort(v){ return {DEL:'DEL',MED:'MED',DEF:'DEF',ARQ:'ARQ'}[v] || v; }
function statLabels(){
  return {pegada:'Pegada', velocidad:'Velocidad', gambeta:'Gambeta', liderazgo:'Liderazgo', resistencia:'Resistencia'};
}
const STAT_ABBR = {pegada:'PEG', velocidad:'VEL', gambeta:'GAM', liderazgo:'LID', resistencia:'RES'};
function ratingWeights(position){
  if(position==='DEL') return {pegada:0.35, velocidad:0.25, gambeta:0.20, liderazgo:0.05, resistencia:0.15};
  if(position==='MED') return {pegada:0.15, velocidad:0.15, gambeta:0.25, liderazgo:0.25, resistencia:0.20};
  if(position==='DEF') return {pegada:0.15, velocidad:0.15, gambeta:0.10, liderazgo:0.30, resistencia:0.30};
  return {pegada:0.10, velocidad:0.10, gambeta:0.10, liderazgo:0.35, resistencia:0.35}; // ARQ: liderazgo+resistencia = reflejos y colocación
}
function ageCurve(age){
  if(age<21) return 0.65 + (age-16)*0.07;
  if(age<=29) return 1.0 + Math.min(age-21,6)*0.02;
  if(age<=33) return 1.12 - (age-29)*0.02;
  return Math.max(0.4, 1.04 - (age-33)*0.06);
}
function findTeam(id){ return league.teams.find(t=>t.id===id); }
function teamInitials(name){ return (name||'?').split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function badgeHtml(team, sizeClass){
  if(!team) return `<div class="badge-fallback" style="background:#333">?</div>`;
  if(team.badge) return `<img class="badge ${sizeClass||''}" src="${team.badge}" alt="${team.name}">`;
  return `<div class="badge-fallback ${sizeClass||''}" style="background:${team.color}">${teamInitials(team.name)}</div>`;
}
let tempNewBadge = null;
let editingTeamId = null;
function readAndResizeImage(file, maxSize, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = maxSize; canvas.height = maxSize;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(maxSize/img.width, maxSize/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (maxSize-w)/2, (maxSize-h)/2, w, h);
      cb(canvas.toDataURL('image/png', 0.85));
    };
    img.onerror = ()=> toast('No se pudo leer esa imagen');
    img.src = e.target.result;
  };
  reader.onerror = ()=> toast('No se pudo leer ese archivo');
  reader.readAsDataURL(file);
}
function onNewTeamBadgeSelected(inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  readAndResizeImage(file, 128, (dataUrl)=>{
    tempNewBadge = dataUrl;
    const preview = document.getElementById('newTeamBadgePreview');
    if(preview) preview.innerHTML = `<img class="badge" src="${dataUrl}" style="width:34px;height:34px;">`;
  });
}
async function onExistingTeamBadgeSelected(inputEl, teamId){
  const file = inputEl.files[0];
  if(!file) return;
  readAndResizeImage(file, 128, async (dataUrl)=>{
    const t = findTeam(teamId);
    if(t){ t.badge = dataUrl; await saveTeam(t); render(); toast('Escudo actualizado'); }
  });
}

/* ================= LEAGUE TAB ================= */
function strengthFromTitles(titles){ return clamp(42 + titles*6, 30, 99); }
async function incrementTeamSimTitles(teamId){
  const t = findTeam(teamId);
  if(!t) return;
  t.simTitles = (t.simTitles||0) + 1;
  await saveTeam(t);
}
function seedTeams(){
  const seed = [
    ['Atlético del Puerto','#1d3f8f'],['Unión del Norte','#a3222c'],['Deportivo Central','#1f6d3c'],
    ['Estrella Roja','#c1432a'],['Racing del Valle','#2c2c2c'],['Boca del Río','#e0a621'],
    ['Ferro Andino','#3a3a5c'],['Talleres del Sur','#0f766e'],['Independiente Bravo','#7c1f2e'],
    ['San Martín FC','#264653'],['Los Andes','#4a2c8a'],['Costa Azul','#0a6ea1']
  ];
  league.teams = seed.map(([name,color])=>{
    const titles = randInt(0,8);
    return {id:uid(),name,color,titles,strength:strengthFromTitles(titles),badge:null};
  });
}

function canEditLeague(){ return !league.pin || unlockedForEdit; }

function renderLiga(){
  const locked = league.pin && !unlockedForEdit;
  const teamsReadonly = `<div class="team-list">` + league.teams.map(t=>{
    if(editingTeamId===t.id){
      return `
      <div class="team-row" style="flex-wrap:wrap;">
        <input type="text" id="editName_${t.id}" value="${t.name.replace(/"/g,'&quot;')}" style="flex:1;min-width:120px;">
        <input type="color" id="editColor_${t.id}" value="${t.color}">
        <div style="display:flex;align-items:center;gap:6px;">
          <label class="muted" style="font-size:11px;">🏆 Títulos</label>
          <input type="text" id="editTitles_${t.id}" value="${t.titles||0}" style="width:52px;text-align:center;">
        </div>
        <button class="btn gold" style="font-size:11px;padding:8px 12px;" onclick="saveTeamEdit('${t.id}')">Guardar</button>
        <button class="btn ghost" style="font-size:11px;padding:8px 12px;" onclick="cancelEditTeam()">Cancelar</button>
      </div>`;
    }
    return `
      <div class="team-row">
        ${badgeHtml(t)}
        <div class="name">${t.name}</div>
        <div class="strength">🏆 ${t.titles||0} títulos</div>
        ${canEditLeague()? `
          <label class="badge-upload-label">
            escudo
            <input type="file" accept="image/*" style="display:none;" onchange="onExistingTeamBadgeSelected(this,'${t.id}')">
          </label>
          <button onclick="editTeam('${t.id}')" style="color:var(--yellow);">editar</button>
          <button onclick="removeTeam('${t.id}')">quitar</button>
        ` : ''}
      </div>`;
  }).join('') + `</div>`;

  if(locked){
    return `
      <div class="card">
        <h2>${league.name}</h2>
        <div class="muted">Esta liga está bloqueada. Solo se pueden ver los equipos; para editarlos hace falta la clave.</div>
        <h3>Equipos (${league.teams.length})</h3>
        ${league.teams.length? teamsReadonly : `<div class="empty"><div class="big">Todavía no hay equipos cargados</div><div class="muted">Esperá a que quien armó la liga los agregue.</div></div>`}
        <h3>¿Sos quien armó la liga?</h3>
        <div class="row">
          <div><input type="text" id="pinInput" placeholder="Clave de edición"></div>
          <div style="flex:0;"><button class="btn ghost" onclick="tryUnlock()">Desbloquear</button></div>
        </div>
      </div>`;
  }

  let teamsHtml = '';
  if(league.teams.length===0){
    teamsHtml = `<div class="empty"><div class="big">Todavía no armaste equipos</div>
      <div class="muted">Cargá los tuyos a mano o generá 12 de ejemplo para arrancar rápido.</div>
      <div class="btn-row" style="justify-content:center;"><button class="btn gold" onclick="doSeedTeams()">Generar 12 equipos de ejemplo</button></div>
    </div>`;
  } else {
    teamsHtml = teamsReadonly;
  }
  return `
    <div class="card">
      <h2>Configurar la liga</h2>
      <div class="muted">Este nombre y estos equipos los ven todos tus amigos que abran este mismo enlace.</div>
      <h3>Logo de la liga</h3>
      <div class="row">
        <div style="display:flex;align-items:center;gap:10px;flex:0;">
          ${league.logo? `<img src="${league.logo}" style="width:44px;height:44px;border-radius:12px;object-fit:cover;border:1px solid var(--line-strong);">` : ''}
          <label class="badge-upload-label">${league.logo? 'cambiar logo':'subir logo'}<input type="file" accept="image/*" style="display:none;" onchange="onLeagueLogoSelected(this)"></label>
        </div>
      </div>
      <label>Nombre de la liga</label>
      <div class="row">
        <div><input type="text" id="leagueNameInput" value="${league.name.replace(/"/g,'&quot;')}"></div>
        <div style="flex:0;"><button class="btn ghost" onclick="renameLeague()">Guardar nombre</button></div>
      </div>
      <h3>Equipos (${league.teams.length})</h3>
      ${teamsHtml}
      <h3>Agregar equipo</h3>
      <div class="row">
        <div><input type="text" id="newTeamName" placeholder="Nombre del equipo"></div>
        <div style="flex:0;"><input type="color" id="newTeamColor" value="#2c6e49"></div>
        <div style="flex:0;display:flex;align-items:center;gap:6px;">
          <label class="muted" style="font-size:11px;">🏆 Títulos</label>
          <input type="text" id="newTeamTitles" value="0" style="width:52px;text-align:center;">
        </div>
        <div style="flex:0;display:flex;align-items:center;gap:8px;">
          <div id="newTeamBadgePreview"></div>
          <label class="badge-upload-label">subir escudo<input type="file" accept="image/*" style="display:none;" onchange="onNewTeamBadgeSelected(this)"></label>
        </div>
        <div style="flex:0;"><button class="btn gold" onclick="addTeam()">Agregar</button></div>
      </div>
      <div class="muted" style="margin-top:8px;">El escudo es opcional. Poné cuántos títulos ganó ese equipo en la historia de tu grupo — cuantos más, más pelea la liga con él. Esto no lo ven los jugadores al elegir club. Después lo podés editar tocando "editar" en cualquier equipo.</div>
      <h3>Bloquear edición</h3>
      ${league.pin? `
        <div class="muted">La liga está bloqueada con clave. Solo quien la conozca puede editar equipos.</div>
        <div class="btn-row"><button class="btn ghost" onclick="removePin()">Quitar bloqueo</button></div>
      ` : `
        <div class="muted">Poné una clave para que tus amigos solo puedan jugar, sin tocar los equipos.</div>
        <div class="row">
          <div><input type="text" id="setPinInput" placeholder="Elegí una clave"></div>
          <div style="flex:0;"><button class="btn gold" onclick="setPin()">Bloquear liga</button></div>
        </div>
      `}
      <h3>Respaldo de la liga</h3>
      <div class="muted">Guardá este texto en algún lado (notas, un chat con vos mismo, etc.) para poder restaurar tu liga si hiciera falta.</div>
      <div class="btn-row"><button class="btn ghost" onclick="exportLeague()">Copiar respaldo</button></div>
      <textarea id="importBox" placeholder="Pegá acá un respaldo para restaurarlo…" style="width:100%;min-height:70px;margin-top:10px;padding:10px;font-family:'JetBrains Mono',monospace;font-size:11px;border:1px solid #cfc6a9;border-radius:3px;"></textarea>
      <div class="btn-row"><button class="btn ghost" onclick="importLeague()">Restaurar desde el texto de arriba</button></div>
    </div>`;
}
async function exportLeague(){
  const data = JSON.stringify(league);
  try{
    await navigator.clipboard.writeText(data);
    toast('Respaldo copiado al portapapeles');
  }catch(e){
    document.getElementById('importBox').value = data;
    toast('Copialo manualmente del cuadro de abajo');
  }
}
async function importLeague(){
  if(!canEditLeague()){ toast('La liga está bloqueada'); return; }
  const raw = document.getElementById('importBox').value.trim();
  if(!raw){ toast('Pegá un respaldo primero'); return; }
  try{
    const parsed = JSON.parse(raw);
    if(!parsed.teams) throw new Error('formato inválido');
    league = parsed;
    await saveLeague();
    render();
    toast('Liga restaurada');
  }catch(e){
    toast('Ese texto no es un respaldo válido');
  }
}
async function onLeagueLogoSelected(inputEl){
  if(!canEditLeague()){ toast('La liga está bloqueada'); return; }
  const file = inputEl.files[0];
  if(!file) return;
  readAndResizeImage(file, 128, async (dataUrl)=>{
    league.logo = dataUrl;
    await saveLeagueMeta(); render(); toast('Logo actualizado');
  });
}
async function setPin(){

async function startDraft(){
  if(league.teams.length<3){ toast('Necesitás al menos 3 equipos cargados en LIGA'); return; }

  const targetOverall = randInt(58,68); // apunta a una media inicial de ~60 a 70 tras aplicar los pesos por posición
  STAT_KEYS.forEach(k=>{
    const base = targetOverall + Math.round((weights[k]-0.2)*60);
    stats[k]=clamp(base+randInt(-4,4), 30, 85);
  });
  const otherTeams = league.teams.filter(t=>!career || t.id!==career.teamId);
  career = {

  };

  render();

function pickDraftOptions(){
  const pool=[...league.teams];
  const picks=[];
  for(let i=0;i<3 && pool.length;i++){ picks.push(pool.splice(randInt(0,pool.length-1),1)[0]); }
  return picks.map(t=>t.id);
}
function updateRating(){
  const w=ratingWeights(career.position);
  let r = STAT_KEYS.reduce((s,k)=>s+career.stats[k]*w[k],0);

function upgradeMainStat(u){ return Object.keys(u.gain).find(k=>k!=='fanLove') || Object.keys(u.gain)[0]; }
function rollUpgradeInstance(){
  const r = Math.random();
  if(r<0.88){ return {...choice(COMMON_UPGRADES), rarity:'Común'}; }
  if(r<0.98){ return {...choice(RARE_UPGRADES), rarity:'Rara'}; }
  return {...choice(MITICA_UPGRADES), rarity:'Mítica'};
}
function rollThreeUpgrades(){
  const picks = []; const used = new Set(); let guard=0;
  while(picks.length<3 && guard<60){
    guard++;
    const cand = rollUpgradeInstance();
    const stat = upgradeMainStat(cand);
    if(!used.has(stat)){ used.add(stat); picks.push(cand); }
  }
  while(picks.length<3){ picks.push(rollUpgradeInstance()); }
  return picks;
}
function applyUpgrade(u){
  Object.keys(u.gain).forEach(k=>{
    if(k==='fanLove'){ career.fanLove=clamp(career.fanLove+u.gain[k],0,100); }
    else { career.stats[k]=clamp((career.stats[k]||0)+u.gain[k],10,99); }
  });
}
function upgradeGainText(u){
  return Object.keys(u.gain).map(k=> k==='fanLove' ? `+${u.gain[k]} Idolatría` : `+${u.gain[k]} ${statLabels()[k]}`).join(' · ');
}

function renderEvent(){
  const ev = pendingEvent;
  return `
    <div class="card phase-in">
      <div class="event-eyebrow">Pasan cosas</div>
      <div class="event-title">${ev.title}</div>
      <p class="muted" style="font-size:14px;">${ev.desc}</p>
      <div class="event-options">
        ${ev.options.map((o,i)=>`<button class="event-option" onclick="resolveEvent(${i})"><b>${o.label}</b><div class="preview">${o.preview||''}</div></button>`).join('')}
      </div>
    </div>`;
}
async function resolveEvent(i){
  const before = career.form + career.fanLove + career.rating;
  const outcome = pendingEvent.options[i].apply();
  const after = career.form + career.fanLove + career.rating;
  career.log.push({age:career.age, text: outcome});
  career._lastVerdict = { good: after>=before, text: outcome };
  if(pendingEvent.unique){
    career.usedEvents = career.usedEvents || [];
    career.usedEvents.push(pendingEvent.id);
  }
  pendingEvent=null;
  const s = computeSeasonPerformance();
  await saveActiveCareer();
  if(s.ligaContention || s.copaContention){
    launchMinigame(s.ligaContention ? 'liga' : 'copa');
  } else {
    await finalizeSeason(false);
  }
}

function applyAgePotential(){
  if(career.age<=24){
    // potencial juvenil: en tus años jóvenes sos más propenso a llegar a una media alta
    if(Math.random()<0.65){
      const w = ratingWeights(career.position);
      const k = Math.random()<0.6 ? STAT_KEYS.reduce((a,b)=> w[b]>w[a]?b:a, STAT_KEYS[0]) : choice(STAT_KEYS);
      career.stats[k] = clamp(career.stats[k]+1,10,99);
      career.log.push({age:career.age, text:`El potencial de la edad te suma +1 en ${statLabels()[k]}.`});
    }
  } else if(career.age>=31){
    // después de los 30 el físico empieza a bajar, y cada vez más rápido
    const declineChance = clamp((career.age-30)*0.17, 0.14, 0.75);
    const hits = career.age>=35 ? 2 : 1;
    for(let i=0;i<hits;i++){
      if(Math.random()<declineChance){
        const physicalStats = ['velocidad','resistencia','gambeta'];
        const k = choice(physicalStats);
        career.stats[k] = clamp(career.stats[k]-1,10,99);
        career.log.push({age:career.age, text:`El paso de los años te resta -1 en ${statLabels()[k]}.`});
      }
    }
  }
}
function checkInjuryRisk(){
  // si descompensás mucho el físico (subís todo menos Resistencia), el cuerpo pasa factura
  const others = STAT_KEYS.filter(k=>k!=='resistencia');
  const avgOthers = others.reduce((s,k)=>s+career.stats[k],0)/others.length;
  const gap = avgOthers - career.stats.resistencia;
  if(gap<=18) return false;
  const chance = clamp((gap-18)/38, 0.05, 0.55);
  return Math.random()<chance;
}
function computeSeasonPerformance(){
  const team = findTeam(career.teamId);
  applyAgePotential();
  if(checkInjuryRisk()){
    career.form = clamp(career.form-16,0,100);
    const s = {teamId:team.id, apps:0, goals:0, assists:0, cleanSheets:0, leaguePos:null, teamPerf:team.strength,
      n:Math.max(4,league.teams.length), ligaContention:false, copaContention:false, growthNote:'',
      rGoals:0, rAssists:0, playerTotal:career.careerGoals+career.careerAssists,
      rivalTotal:career.rival.goals+career.rival.assists, rivalWonSeason:true, injured:true};
    career.log.push({age:career.age, text:`Una lesión por sobrecarga física (descompensaste el cuerpo con poca Resistencia) te deja afuera toda la temporada.`});
    career._pendingSeason = s;
    return s;
  }
  const w = ratingWeights(career.position);
  let overall = STAT_KEYS.reduce((s,k)=>s+career.stats[k]*w[k],0);
  overall *= ageCurve(career.age);
  overall = clamp(overall + randRange(-4,4) + (career.form-65)*0.08, 30, 99);
  career.rating = Math.round(overall);
  if(career.rating>career.peakRating) career.peakRating=career.rating;

  const apps = randInt(18,38);
  let goals=0, assists=0, cleanSheets=0;
  if(career.position==='ARQ'){
    cleanSheets = Math.round(apps*((career.stats.liderazgo+career.stats.resistencia)/280)*randRange(0.6,1.1));
  } else if(career.position==='DEL'){
    goals = Math.round(apps*((career.stats.pegada*0.55+career.stats.velocidad*0.45)/200)*randRange(0.6,1.3));
    assists = Math.round(apps*(career.stats.gambeta/280)*randRange(0.4,1));
  } else if(career.position==='MED'){
    goals = Math.round(apps*((career.stats.pegada*0.5+career.stats.velocidad*0.5)/300)*randRange(0.4,1));
    assists = Math.round(apps*(career.stats.gambeta/200)*randRange(0.6,1.2));
  } else {
    goals = Math.round(apps*((career.stats.pegada*0.5+career.stats.velocidad*0.5)/460)*randRange(0.2,0.8));
    assists = Math.round(apps*(career.stats.gambeta/320)*randRange(0.3,0.8));
  }
  goals=Math.max(0,goals); assists=Math.max(0,assists); cleanSheets=Math.max(0,cleanSheets);

  // el liderazgo hace jugar mejor al equipo y facilita llegar a instancias finales
  const teamPerf = clamp(team.strength*0.8 + career.rating*0.12 + (career.stats.liderazgo-50)*0.18 + randRange(-8,8), 20, 99);
  const n = Math.max(4, league.teams.length);
  // el puesto en la tabla se calcula rankeando a TODOS los equipos por su poder (equipos grandes tienden arriba),
  // con algo de ruido por temporada y un empujón extra del propio equipo por vos
  const seasonNoise = 10;
  const standings = league.teams.map(t=>({
    id: t.id,
    score: t.strength + randRange(-seasonNoise, seasonNoise) + (t.id===team.id ? (career.rating-60)*0.2 + (career.stats.liderazgo-50)*0.12 : 0)
  })).sort((a,b)=>b.score-a.score);
  let leaguePos = standings.findIndex(x=>x.id===team.id)+1;
  if(leaguePos<=0) leaguePos = n;
  // pelear el título depende de un puntaje continuo (rendimiento + liderazgo), no de acertar el puesto 1 exacto
  const liderazgoBoost = clamp((career.stats.liderazgo-50)/90, -0.2, 0.55);
  const titleRaceScore = teamPerf + (career.stats.liderazgo-50)*0.25;
  const ligaChance = clamp((titleRaceScore-52)/42 + liderazgoBoost*0.4, 0.04, 0.85);
  const copaChance = clamp((titleRaceScore-42)/40 + liderazgoBoost*0.4, 0.05, 0.9);
  const ligaContention = Math.random()<ligaChance;
  const copaContention = !ligaContention && Math.random()<copaChance;

  career.careerApps += apps; career.careerGoals += goals; career.careerAssists += assists;
  const perfDelta = career.rating - 60;
  career.fanLove = clamp(career.fanLove + Math.round(perfDelta/12), 0, 100);

  // el rendimiento de la temporada también hace crecer las stats, no solo el dado
  const primaryStat = STAT_KEYS.reduce((a,b)=> w[b]>w[a]?b:a, STAT_KEYS[0]);
  const secondaryStat = STAT_KEYS.filter(k=>k!==primaryStat).reduce((a,b)=> w[b]>w[a]?b:a, STAT_KEYS.filter(k=>k!==primaryStat)[0]);
  const productivity = career.position==='ARQ' ? cleanSheets/Math.max(1,apps) : (goals+assists)/Math.max(1,apps);
  let growthNote = '';
  if(productivity>=0.5){
    career.stats[primaryStat]=clamp(career.stats[primaryStat]+2,10,99);
    career.stats[secondaryStat]=clamp(career.stats[secondaryStat]+1,10,99);
    growthNote = ` El nivel que mostraste te hizo crecer en la cancha (+2 ${statLabels()[primaryStat]}, +1 ${statLabels()[secondaryStat]}).`;
  } else if(productivity>=0.28){
    career.stats[primaryStat]=clamp(career.stats[primaryStat]+1,10,99);
    growthNote = ` Sumaste experiencia esta temporada (+1 ${statLabels()[primaryStat]}).`;
  }

  // rival de la temporada
  const rq = career.rival.quality;
  const rGoals = Math.max(0, Math.round(randInt(8,26) * (rq/70)));
  const rAssists = Math.max(0, Math.round(randInt(4,16) * (rq/70)));
  career.rival.goals += rGoals; career.rival.assists += rAssists;
  const playerTotal = career.careerGoals + career.careerAssists;
  const rivalTotal = career.rival.goals + career.rival.assists;
  const rivalWonSeason = (rGoals+rAssists) > (goals+assists);

  const s = {teamId:team.id, apps, goals, assists, cleanSheets, leaguePos, teamPerf, n,
    ligaContention, copaContention, growthNote, rGoals, rAssists, playerTotal, rivalTotal, rivalWonSeason};
  career._pendingSeason = s;
  return s;
}

async function finalizeSeason(won){
  const s = career._pendingSeason;
  const team = findTeam(s.teamId);
  let wonLiga=false, wonCopa=false, wonInternacional=false;
  if(!s.injured){
    if(s.ligaContention){
      wonLiga = won;
      s.leaguePos = won ? 1 : 2; // si peleaste el título, terminás 1° o 2°, no un puesto random
    } else if(s.copaContention){
      wonCopa = won;
    }
  }
  if(wonLiga){
    career.trophies.ligas++;
    incrementTeamSimTitles(team.id);
    career.stats.liderazgo=clamp(career.stats.liderazgo+1,10,99);
    wonInternacional = team.strength>82 && Math.random()<0.22;
    if(wonInternacional) career.trophies.internacionales++;
  }
  if(wonCopa){
    career.trophies.copas++;
    incrementTeamSimTitles(team.id);
    career.stats.liderazgo=clamp(career.stats.liderazgo+1,10,99);
  }
  career.fanLove = clamp(career.fanLove + (wonLiga?8:0) + (wonCopa?4:0) + ((s.ligaContention||s.copaContention) && !won ? -3 : 0), 0, 100);

  let text;
  if(s.injured){
    text = `Pasás toda la temporada afuera por una lesión. ${team.name} sigue el campeonato sin vos mientras te recuperás.`;
  } else {
    text = `Temporada con ${team.name}: ${s.apps} partidos`;
    if(career.position==='ARQ') text += `, ${s.cleanSheets} vallas invictas`;
    else text += `, ${s.goals} goles y ${s.assists} asistencias`;
    text += `. El equipo terminó ${s.leaguePos}° en la tabla`;
    if(wonLiga) text += ' y se consagró CAMPEÓN de liga';
    else if(wonCopa) text += ' y se quedó con una copa';
    else if(s.ligaContention) text += '. Llegaron a la definición de liga pero no se pudo';
    else if(s.copaContention) text += '. Llegaron a la final de copa pero no se pudo';
    if(wonInternacional) text += ', además de gloria internacional';
    text += '.';
    text += s.growthNote;
  }
  career.log.push({age:career.age, text});

  career._lastSummary = {...s, wonLiga, wonCopa, wonInternacional, text};
  const scoutTeam = (wonLiga || wonCopa || s.injured) ? null : rollScoutInterest();
  career._scoutOffer = scoutTeam ? scoutTeam.id : null;
  career._minigame = null;
  career._pendingSeason = null;
  career.phase='summary';
  updateRating();
  await saveActiveCareer();
  render();
}

/* interés espontáneo de otros clubes: más probable con buen liderazgo/rating,
   más difícil cuanto más títulos tiene el club interesado */
function rollScoutInterest(){
  const others = league.teams.filter(t=>t.id!==career.teamId);
  if(!others.length) return null;
  const chance = clamp((career.stats.liderazgo + career.rating)/260, 0.05, 0.4);
  if(Math.random()>=chance) return null;
  const weighted = others.map(t=>({t, w: Math.max(1, 100 - (t.titles||0)*7 + (career.stats.liderazgo-50))}));
  const totalW = weighted.reduce((s,x)=>s+x.w,0);
  let r = Math.random()*totalW;
  let picked = weighted[0].t;
  for(const x of weighted){ if(r<x.w){ picked=x.t; break; } r-=x.w; }
  return picked;
}

/* ================================================================
   MINIJUEGO DE DEFINICIÓN (Liga / Copa FuxBall)
   ----------------------------------------------------------------
   GANCHO PARA TU PROPIO MINIJUEGO:
   Si en algún momento subís tu propio archivo de "la Copa" y ese
   archivo define, antes de </body>, una función global:
       window.customCupMinigame = function(context, onResult){ ... }
   donde:
     - context = { type: 'liga'|'copa', career, team }
     - onResult(true)  => tu jugador GANA el título
     - onResult(false) => tu jugador NO gana el título esta vez
   entonces el juego va a usar TU minijuego en vez del de penales
   que viene incorporado. No hace falta tocar nada más de este
   archivo para que funcione, solo pegar tu script antes de </body>.
   ================================================================ */
const ZONES = ['izquierda','centro','derecha'];
function launchMinigame(type){
  if(typeof window.customCupMinigame === 'function'){
    const team = findTeam(career.teamId);
    window.customCupMinigame({type, career, team}, async (won)=>{ await finalizeSeason(!!won); });
    return;
  }
  const others = league.teams.filter(t=>t.id!==career.teamId);
  const shuffled = [...others];
  const opps = [];
  for(let i=0;i<Math.min(3,shuffled.length);i++){ opps.push(shuffled.splice(randInt(0,shuffled.length-1),1)[0]); }
  while(opps.length<3 && others.length){ opps.push(choice(others)); }
  career._playoff = { type, opponents: opps.map(t=>t.id), matchIndex:0, wins:0, results:[], showReveal:false };
  career.phase='minigame';
  startPlayoffMatch();
}
function playoffLabel(){
  const p = career._playoff;
  const base = p.type==='liga' ? 'Liga — partidos importantes' : 'Copa FuxBall — fase de grupos';
  const opp = findTeam(p.opponents[p.matchIndex]);
  return `${base} · Partido ${p.matchIndex+1}/3 vs ${opp?opp.name:''}`;
}
async function startPlayoffMatch(){
  const variant = choice(['penales','cuatro','simon','zonaverde']);
  if(variant==='penales'){
    const dist = {};
    let remaining = 1;
    ZONES.forEach((z,i)=>{
      const v = i===ZONES.length-1 ? remaining : Math.random()*remaining*0.7;
      dist[z] = Math.round(v*100)/100;
      remaining -= v;
    });
    career._minigame = { variant, round:0, goals:0, shots:3, dist, done:false };
  } else if(variant==='cuatro'){
    career._minigame = { variant, board:Array(25).fill(null), done:false, won:null };
  } else if(variant==='simon'){
    career._minigame = { variant, sequence: Array.from({length: randInt(4,6)}, ()=>randInt(0,15)), phase:'idle', playerIndex:0, done:false, won:null };
  } else {
    career._minigame = { variant, round:0, rounds:3, hits:0, pos:0, dir:1, running:false, done:false };
  }
  await saveActiveCareer();
  render();
}
async function resolvePlayoffMatch(won){
  const p = career._playoff;
  const oppId = p.opponents[p.matchIndex];
  p.results.push({teamId:oppId, won});
  if(won) p.wins++;
  career.playoffHistory = career.playoffHistory || [];
  career.playoffHistory.push({
    teamId: oppId, teamName: (findTeam(oppId)||{}).name||'', teamBadge: (findTeam(oppId)||{}).badge||null,
    won, competition: p.type, year: career.startYear+(career.age-16)
  });
  p.showReveal = true;
  await saveActiveCareer();
  render();
}
async function continuePlayoff(){
  const p = career._playoff;
  p.matchIndex++;
  p.showReveal = false;
  if(p.matchIndex>=3){
    const overallWon = p.wins>=2;
    career._playoff=null;
    career._minigame=null;
    await finalizeSeason(overallWon);
    return;
  }
  await startPlayoffMatch();
}
function renderPlayoffReveal(){
  const p = career._playoff;
  const last = p.results[p.results.length-1];
  const opp = findTeam(last.teamId);
  return `

      <div class="muted">${last.won? 'Le ganaste a' : 'Caíste ante'} ${opp?opp.name:''}. Llevás ${p.wins} de ${p.results.length} ganados.</div>
      <div class="btn-row" style="justify-content:center;"><button class="btn gold" onclick="continuePlayoff()">${p.matchIndex+1>=3? 'Ver resultado final' : 'Siguiente partido'}</button></div>
    </div>`;
}
function renderMinigame(){

function renderPenales(){

async function resolveMinigameShot(zone){
  const m = career._minigame;
  const dist = m.dist;
  const r = Math.random();
  let acc=0, keeperDive=ZONES[ZONES.length-1];
  for(const z of ZONES){ acc+=dist[z]; if(r<=acc){ keeperDive=z; break; } }
  const pegada = career.stats.pegada, velocidad = career.stats.velocidad;
  let goalChance;
  if(zone===keeperDive){ goalChance = clamp(0.08 + (pegada+velocidad)/520, 0.06, 0.35); }
  else { goalChance = clamp(0.55 + pegada/600, 0.5, 0.78); }
  const scored = Math.random()<goalChance;
  if(scored) m.goals++;
  m.round++;
  career.log.push({age:career.age, text: scored? `Penal convertido, tiró a la ${zone}.` : `Penal errado, el arquero adivinó y se tiró a la ${keeperDive}.`});
  if(m.round>=m.shots){ await resolvePlayoffMatch(m.goals>=2); return; }
  await saveActiveCareer();
  render();
}

/* ---------- Variante 2: 4 en línea ---------- */
const C4_SIZE = 5, C4_WIN = 4;
function c4CheckWin(board, symbol){
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for(let r=0;r<C4_SIZE;r++){
    for(let c=0;c<C4_SIZE;c++){
      if(board[r*C4_SIZE+c]!==symbol) continue;
      for(const [dr,dc] of dirs){
        let ok=true;
        for(let k=1;k<C4_WIN;k++){
          const nr=r+dr*k, nc=c+dc*k;
          if(nr<0||nr>=C4_SIZE||nc<0||nc>=C4_SIZE||board[nr*C4_SIZE+nc]!==symbol){ ok=false; break; }
        }
        if(ok) return true;
      }
    }
  }
  return false;
}
function c4Windows(idx){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  const r=Math.floor(idx/C4_SIZE), c=idx%C4_SIZE;
  const windows=[];
  for(const [dr,dc] of dirs){
    for(let start=-(C4_WIN-1); start<=0; start++){
      const cells=[]; let ok=true;
      for(let k=0;k<C4_WIN;k++){
        const nr=r+dr*(start+k), nc=c+dc*(start+k);
        if(nr<0||nr>=C4_SIZE||nc<0||nc>=C4_SIZE){ ok=false; break; }
        cells.push(nr*C4_SIZE+nc);
      }
      if(ok) windows.push(cells);
    }
  }
  return windows;
}
function c4EvalMove(board, idx, symbol){
  const other = symbol==='X'?'O':'X';
  let score=0;
  for(const w of c4Windows(idx)){
    const vals = w.map(i=>board[i]);
    const countSym = vals.filter(v=>v===symbol).length;
    const countOther = vals.filter(v=>v===other).length;
    if(countOther===0) score += Math.pow(3,countSym);
    if(countSym===0) score += Math.pow(2.4,countOther);
  }
  const center = Math.floor(C4_SIZE*C4_SIZE/2);
  const r=Math.floor(idx/C4_SIZE), c=idx%C4_SIZE;
  const cr=Math.floor(center/C4_SIZE), cc=center%C4_SIZE;
  score += (C4_SIZE - (Math.abs(r-cr)+Math.abs(c-cc)))*0.3;
  return score;
}
function c4BestMove(board, symbol){
  const other = symbol==='X'?'O':'X';
  const empties = board.map((v,i)=>v?null:i).filter(v=>v!==null);
  for(const i of empties){ const b=[...board]; b[i]=symbol; if(c4CheckWin(b,symbol)) return i; }
  for(const i of empties){ const b=[...board]; b[i]=other; if(c4CheckWin(b,other)) return i; }
  const scored = empties.map(i=>({i, s:c4EvalMove(board,i,symbol)+randRange(0,1.6)}));
  scored.sort((a,b)=>b.s-a.s);
  return scored[0].i;
}
function renderCuatroEnLinea(){
  const m = career._minigame;
  const pegada = career.stats.pegada;
  let hintIdx = -1;
  if(pegada>=55 && m.board.some(v=>v)){
    const cand = c4BestMove(m.board, 'X');
    if(Math.random() < clamp(pegada/130, 0.2, 0.7)) hintIdx = cand;
  }
  return `
    <div class="card phase-in">
      <h2>${playoffLabel()}</h2>
      <div class="muted">La jugada ensayada del entrenador: hacé <b style="color:var(--green);">4 en línea</b> (vos <b style="color:#8fb2ff;">X</b>) antes que el rival (<b style="color:var(--red);">O</b>) y sale el gol.</div>
      <div class="c4-grid">
        ${m.board.map((v,i)=>`<button class="c4-cell ${v==='X'?'x':v==='O'?'o':''} ${i===hintIdx?'hint':''}" onclick="c4PlayerMove(${i})" ${v?'disabled':''}>${v||''}</button>`).join('')}
      </div>
    </div>`;
}
async function c4PlayerMove(i){
  const m = career._minigame;
  if(m.board[i]) return;
  m.board[i]='X';
  if(c4CheckWin(m.board,'X')){ await resolvePlayoffMatch(true); return; }
  if(!m.board.some(v=>!v)){ await resolvePlayoffMatch(Math.random()<clamp(0.4+career.stats.pegada/300,0.3,0.7)); return; }
  const oIdx = c4BestMove(m.board,'O');
  m.board[oIdx]='O';
  if(c4CheckWin(m.board,'O')){ await resolvePlayoffMatch(false); return; }
  if(!m.board.some(v=>!v)){ await resolvePlayoffMatch(Math.random()<clamp(0.4+career.stats.pegada/300,0.3,0.7)); return; }
  await saveActiveCareer();
  render();
}

let zvRafId = null;
function zvAction(){
  const m = career._minigame;
  if(!m.running){
    m.running = true; m.pos = 0; m.dir = 1;
    const btn = document.getElementById('zvBtn'); if(btn) btn.textContent='PARAR';
    const speed = clamp(1.6 + career.stats.velocidad/40, 1.4, 3.2);
    const step = ()=>{
      if(!m.running) return;
      m.pos += m.dir*speed;
      if(m.pos>=97){ m.pos=97; m.dir=-1; }
      if(m.pos<=0){ m.pos=0; m.dir=1; }
      const marker = document.getElementById('zvMarker');
      if(marker) marker.style.left = m.pos+'%';
      zvRafId = requestAnimationFrame(step);
    };
    zvRafId = requestAnimationFrame(step);
  } else {
    zvStop();
  }
}
async function zvStop(){
  const m = career._minigame;
  m.running = false;
  if(zvRafId){ cancelAnimationFrame(zvRafId); zvRafId=null; }
  const zoneWidth = clamp(14 + career.stats.pegada/6, 12, 34);
  const zoneStart = 50 - zoneWidth/2;
  const hit = m.pos>=zoneStart && m.pos<=zoneStart+zoneWidth;
  if(hit) m.hits++;
  m.round++;
  career.log.push({age:career.age, text: hit? 'Centro perfecto a la zona verde.' : 'El centro se te escapó de la zona.'});

  await saveActiveCareer();
  render();
}

    items.push({cls: s.rivalWonSeason?'neg':'pos', ic:'⚡', text:`Tu archirrival <b>${career.rival.name}</b> hizo ${s.rGoals}G y ${s.rAssists}A ${s.rivalWonSeason?'y este año te ganó la temporada':'pero no te alcanzó este año'}. En el duelo general vas ${s.playerTotal>=s.rivalTotal?'adelante':'atrás'} ${s.playerTotal}-${s.rivalTotal} en goles+asistencias. Juega en ${career.rival.team}.`});
    if(s.wonLiga) items.push({cls:'pos', ic:'🏆', text:`¡${team.name} se consagró <b>CAMPEÓN de Liga</b>!`});
    else if(s.wonCopa) items.push({cls:'pos', ic:'🏆', text:`${team.name} se quedó con una <b>copa</b> esta temporada.`});
    else if(s.leaguePos<=3) items.push({cls:'pos', ic:'📈', text:'Terminaron entre los mejores: el año que viene se pelea otra vez arriba.'});
  }

  const scoutTeam = career._scoutOffer ? findTeam(career._scoutOffer) : null;
  const scoutBox = scoutTeam ? `
    <div class="verdict-box good" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <div style="flex:1;min-width:180px;">🔎 Un ojeador de <b>${scoutTeam.name}</b> te vino a ver esta temporada y le gustó lo que vio.</div>
      <button class="btn gold" style="font-size:12px;padding:8px 12px;" onclick="acceptScoutOffer()">Escuchar oferta</button>
      <button class="btn ghost" style="font-size:12px;padding:8px 12px;" onclick="declineScoutOffer()">Seguir en ${team.name}</button>
    </div>` : '';

  return `
    <div class="card phase-in">
      <div class="season-eyebrow"><span>Potrero Deportivo</span><span>${career.startYear + (career.age-16)} · Temporada ${career.age-15}</span></div>
      <div class="season-headline">${hl.h}</div>
      <div class="season-sub">${hl.sub}</div>
      <div class="season-grade"><span class="l">Nota de la temporada</span><span class="n">${grade.toFixed(1)}</span></div>
      ${v? `<div class="verdict-box ${v.good?'good':'bad'}">${v.good?'✅':'⚠️'} ${v.text}</div>` : ''}
      ${scoutBox}
      <div class="season-feed">
        ${items.map(it=>`<div class="season-feed-item ${it.cls}"><div class="ic">${it.ic}</div><div>${it.text}</div></div>`).join('')}
      </div>
      <div class="btn-row" style="flex-direction:column;align-items:stretch;">
        ${!mustRetire && !scoutTeam ? `<button class="btn gold" onclick="nextSeason()">Continuar</button>`:''}
        ${canRetire && !scoutTeam ? `<button class="btn ghost" onclick="retireCareer()">Retirarme ahora</button>`:''}
      </div>
      ${mustRetire? `<div class="muted" style="margin-top:8px;">A esta edad el cuerpo ya no da para más. Es hora de colgar los botines.</div>`:''}
    </div>`;
}
async function acceptScoutOffer(){
  const newTeam = findTeam(career._scoutOffer);
  const oldTeam = findTeam(career.teamId);
  if(!newTeam) return;
  career.teamId = newTeam.id;
  career.fanLove = clamp(Math.round(career.fanLove*0.5), 0, 100);
  career.log.push({age:career.age, text:`Un ojeador de ${newTeam.name} lo convence y deja ${oldTeam.name} para sumarse a ese club.`});
  career._scoutOffer = null;
  await saveActiveCareer(); render(); toast(`Fichaste por ${newTeam.name}`);
}
async function declineScoutOffer(){
  career._scoutOffer = null;
  await saveActiveCareer(); render();
}
async function nextSeason(){
  career.age++;
  career.marketCounter = (career.marketCounter||0) + 1;
  if(career.marketCounter >= (career.nextMarketThreshold||2)){
    career.marketCounter = 0;
    career.nextMarketThreshold = randInt(2,3);
    await saveActiveCareer();
    openTransferMarket(true);
    return;
  }
  await saveActiveCareer();
  await rollPreseason();
}

const LEGEND_LINES = {
  top:[
    "Los pibes del club van a hablar de vos por generaciones.",
    "Le pusieron tu nombre a una tribuna del estadio.",
    "Cuentan que entrenabas de más porque no soportaba jugar mal.",
    "Los relatores todavía repiten tu apodo cuando ven a un pibe parecido."
  ],
  high:[
    "Fuiste de esos jugadores que la gente recuerda partido por partido.",
    "Te ganaste el cariño de una hinchada entera a fuerza de laburo.",
    "Nunca fuiste la estrella más rutilante, pero siempre estuviste."
  ],
  mid:[
    "Cumpliste, y en este juego cumplir ya es mucho.",
    "Ni leyenda ni olvido: un profesional correcto, de esos que sostienen un plantel.",
    "Diste pelea partido a partido sin hacer mucho ruido."
  ],
  low:[
    "La carrera no salió como soñabas, pero jugaste al fútbol para vivir. Ya es un montón.",
    "Quedó plata arriba de la mesa y sueños sin cumplir del todo.",
    "Un futbolista más, de los miles que lo intentaron."
  ]
};
function computeScore(){
  return Math.round(
    career.careerGoals*2 + career.careerAssists*1.5 +
    career.trophies.ligas*40 + career.trophies.copas*25 + career.trophies.internacionales*60 +
    career.peakRating*3 + career.fanLove
  );
}
function tierFor(score){
  if(score>=1600) return {name:'Leyenda Absoluta', lines:LEGEND_LINES.top};
  if(score>=1150) return {name:'Ídolo de Club', lines:LEGEND_LINES.high};
  if(score>=750) return {name:'Referente', lines:LEGEND_LINES.mid};
  if(score>=400) return {name:'Profesional Correcto', lines:LEGEND_LINES.mid};
  return {name:'Promesa que no fue', lines:LEGEND_LINES.low};
}
let isRetiring = false;
async function retireCareer(){
  if(isRetiring) return;
  isRetiring = true;
  const app = document.getElementById('app');
  if(app) app.innerHTML = `<div class="card"><div class="spinner-row"><div class="spinner"></div><span>Cerrando tu carrera…</span></div></div>` + app.innerHTML;
  try{
    const score = computeScore();
    const tier = tierFor(score);
    const team = findTeam(career.teamId);
    const entry = {
      id: career.id, name: career.name, position: career.position, team: team?team.name:'', teamColor: team?team.color:'#888', teamBadge: team?team.badge:null,
      retireAge: career.age, tier: tier.name, score,
      goals: career.careerGoals, assists: career.careerAssists, apps: career.careerApps,
      trophies: career.trophies, flavor: choice(tier.lines),
      rivalName: career.rival.name, rivalTeam: career.rival.team,
      playerTotal: career.careerGoals+career.careerAssists, rivalTotal: career.rival.goals+career.rival.assists,
      playoffHistory: career.playoffHistory||[],
      timestamp: Date.now()
    };
    await saveHistoryEntry(entry);
    await saveLeaderboardEntry(entry);
    await clearActiveCareer();
    await pruneHistoryToRecent(3);
    await loadHistory();
    await loadLeaderboard();
    tab='ranking';
    render();
    const link = `${window.location.origin}${window.location.pathname}?career=${entry.id}`;
    showCareerLinkToast(entry, link);
  } finally {
    isRetiring = false;
  }
}
async function pruneHistoryToRecent(keep){
  const keys = localListPrefix('history:');
  const withData = keys.map(k=>({k, v:localGet(k)})).filter(x=>x.v)
    .map(x=>({k:x.k, entry:safeParse(x.v,null)})).filter(x=>x.entry);
  withData.sort((a,b)=>(b.entry.timestamp||0)-(a.entry.timestamp||0));
  withData.slice(keep).forEach(x=>localDelete(x.k));
}
function renderPlayoffHistoryList(playoffHistory){

      <div class="season-feed-item pos"><div class="ic">🏆</div><div>Títulos personales: <b>${entry.trophies.ligas}</b> ligas, <b>${entry.trophies.copas}</b> copas, <b>${entry.trophies.internacionales}</b> internacionales.</div></div>

/* ================= CAREER: MAIN CARD (in-progress view) ================= */
function marketValue(){
  const base = career.rating*career.rating*140;
  const ageFactor = career.age<27 ? 1+((27-career.age)*0.035) : 1-((career.age-27)*0.05);
  const v = Math.max(20000, Math.round(base*Math.max(0.15,ageFactor)/1000)*1000);
  return v>=1000000 ? `US$ ${(v/1000000).toFixed(1)}M` : `US$ ${Math.round(v/1000)}K`;
}
function idolatriaTier(v){
  if(v>=90) return 'Ídolo total';
  if(v>=65) return 'Referente';
  if(v>=35) return 'Uno más';
  if(v>=15) return 'Anónimo';
  return 'Resistido';
}

/* ================= MERCADO DE PASES (pase único por carrera) ================= */
function offerSalary(team){
  const base = career.rating*career.rating*4 + team.strength*30;
  return clamp(Math.round(base/1000)*1000, 2000, 60000);
}
function playtimeDelta(team){
  const current = findTeam(career.teamId);
  if(!current) return 'up';
  return team.strength < current.strength ? 'up' : 'down';
}
function openTransferMarket(periodic){
  const otherTeams = league.teams.filter(t=>t.id!==career.teamId);
  career._marketFromPeriodic = !!periodic;
  if(otherTeams.length<2){
    career._marketOffers = [];
  } else {
    const shuffled = [...otherTeams];
    const offers = [];
    for(let i=0;i<Math.min(4,shuffled.length);i++){ offers.push(shuffled.splice(randInt(0,shuffled.length-1),1)[0]); }
    career._marketOffers = offers.map(t=>t.id);
  }
  career.phase='market';
  render();
}
function renderMarket(){
  const team = findTeam(career.teamId);
  const offers = (career._marketOffers||[]).map(id=>findTeam(id)).filter(Boolean);
  const renewYears = randInt(2,3);
  const renewSalary = offerSalary(team);
  const nextTierAt = career.fanLove<15?15:career.fanLove<35?35:career.fanLove<65?65:career.fanLove<90?90:100;
  const ptsToNext = Math.max(0, nextTierAt-career.fanLove);
  const renewCard = `
    <button class="market-card" onclick="renewWithCurrentTeam()">
      <div class="mk-badge-renew">Renovación</div>
      <div class="mk-top">${badgeHtml(team,'dossier-badge')}<div><div class="mk-name" style="color:${team.color}">${team.name}</div><div class="mk-league">${league.name}</div></div></div>
      <div class="mk-salary">US$ ${Math.round(renewSalary/1000)}K<small>/mes · ${renewYears} años</small></div>
      <div class="mk-note">Seguís en el club que ya conoce tu nivel.</div>
      ${ptsToNext>0? `<div class="mk-progress-track"><div class="mk-progress-fill" style="width:${career.fanLove}%"></div></div><div class="mk-note">Te faltan ${ptsToNext} pts de idolatría para el próximo escalón.</div>` : `<div class="mk-note up">¡Ya sos ${idolatriaTier(career.fanLove)} para esta hinchada!</div>`}
    </button>`;
  const offerCards = offers.map(t=>{
    const salary = offerSalary(t);
    const years = randInt(2,3);
    const delta = playtimeDelta(t);
    const idolLoss = Math.round(career.fanLove*0.5);
    return `
    <button class="market-card" onclick="acceptTransfer('${t.id}')">
      <div class="mk-top">${badgeHtml(t,'dossier-badge')}<div><div class="mk-name" style="color:${t.color}">${t.name}</div><div class="mk-league">${league.name}</div></div></div>
      <div class="mk-salary">US$ ${Math.round(salary/1000)}K<small>/mes · ${years} años</small></div>
      <div class="mk-note ${delta==='up'?'up':'down'}">${delta==='up'?'↑ Vas a jugar MÁS que ahora':'↓ Vas a jugar MENOS que ahora'}</div>
      <div class="mk-note down">Dejás ${team.name}: -${idolLoss} de idolatría</div>
      <div class="mk-note">Allá arrancás: ${idolatriaTier(2)} (2/100) — tu fama te precede</div>
    </button>`;
  }).join('');
  return `
    <div class="card phase-in">
      <h2>Mercado de pases</h2>
      <div class="muted">${offers.length? 'El dado trajo estas ofertas. Elegí: ¿gloria o billetera?' : 'Es momento de arreglar tu contrato.'}</div>
      <div class="market-grid">
        ${renewCard}
        ${offerCards}
      </div>
    </div>`;
}
async function renewWithCurrentTeam(){
  career.fanLove = clamp(career.fanLove+5,0,100);
  career.log.push({age:career.age, text:`Renueva contrato con ${findTeam(career.teamId).name}.`});
  await resolveMarketDone();
  toast('Renovaste contrato');
}
async function acceptTransfer(teamId){
  const newTeam = findTeam(teamId);
  const oldTeam = findTeam(career.teamId);
  career.teamId = teamId;
  career.usedTransferRequest = true;
  career.fanLove = clamp(Math.round(career.fanLove*0.5), 0, 100);
  career.log.push({age:career.age, text:`Pide el pase y deja ${oldTeam.name} para sumarse a ${newTeam.name}.`});
  await resolveMarketDone();
  toast(`Fichaste por ${newTeam.name}`);
}
async function cancelTransfer(){ await resolveMarketDone(); }
async function resolveMarketDone(){
  const wasPeriodic = career._marketFromPeriodic;
  career._marketOffers=null;
  career._marketFromPeriodic=false;
  career.phase = 'idle';
  await saveActiveCareer();
  if(wasPeriodic){ await rollPreseason(); } else { render(); }
}

function renderCarreraParts(){
  if(!career){
    let hist = '';
    if(history.length){
      hist = `<div class="card"><h2>Tu historial</h2>
        <div class="muted" style="margin-bottom:6px;">Se guardan tus últimas 3 carreras retiradas. Tocá una para volver a verla.</div>
        <div class="ledger">
        ${history.map(h=>`<div class="ledger-row" style="cursor:pointer;" onclick="window.location.search='?career=${h.id}'"><div class="age">${h.retireAge}a</div><div class="detail">${h.name} — <span class="tier-badge">${h.tier}</span></div><div class="num">${h.score} ⭐</div></div>`).join('')}
      </div></div>`;
    }
    return {dossier:null, phase: renderCareerCreate() + hist};
  }
  if(career.phase==='draft') return {dossier:null, phase: renderDraft()};
  if(career.phase==='market') return {dossier:null, phase: renderMarket()};
  if(career.phase==='minigame') return {dossier:null, phase: renderMinigame()};
  const dossier = renderActiveCareerCard();
  let phaseHtml = '';
  if(career.phase==='training-choices') phaseHtml = renderTrainingChoices();
  else if(career.phase==='event') phaseHtml = renderEvent();
  else if(career.phase==='summary') phaseHtml = renderSummary();
  else phaseHtml = `<div class="card phase-in"><div class="btn-row" style="justify-content:center;"><button class="btn gold" onclick="beginSeasonFlow()">Vivir la temporada ${career.age}</button></div></div>`;
  phaseHtml += renderLogCard();
  return {dossier, phase: phaseHtml};
}
