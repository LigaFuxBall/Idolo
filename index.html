/* ================= RENDER / NAV ================= */
function setTab(t){
  if(t==='liga' && !isAdmin) return;
  tab=t; render();
}
let lastDossierHtml = null;
function render(){
  const ligaBtn = document.getElementById('tabLigaBtn');
  if(ligaBtn) ligaBtn.style.display = isAdmin ? '' : 'none';
  if(tab==='liga' && !isAdmin) tab='carrera';
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  const app=document.getElementById('app');
  if(tab==='carrera'){
    const {dossier, phase} = renderCarreraParts();
    let dSlot = document.getElementById('dossierSlot');
    let pSlot = document.getElementById('phaseSlot');
    if(!dSlot || !pSlot || !app.contains(dSlot)){
      app.innerHTML = `<div id="dossierSlot"></div><div id="phaseSlot"></div>`;
      dSlot = document.getElementById('dossierSlot');
      pSlot = document.getElementById('phaseSlot');
      lastDossierHtml = null;
    }
    if(dossier===null){
      if(dSlot.innerHTML!==''){ dSlot.innerHTML=''; }
      lastDossierHtml = null;
    } else if(dossier!==lastDossierHtml){
      dSlot.innerHTML = dossier;
      lastDossierHtml = dossier;
    }
    pSlot.innerHTML = phase;
  } else {
    lastDossierHtml = null;
    if(tab==='liga') app.innerHTML = renderLiga();
    else app.innerHTML = renderRanking();
  }
  const logoEl = document.getElementById('logoMark');
  if(logoEl){ logoEl.innerHTML = league.logo ? `<img src="${league.logo}">` : `<span></span><span></span><span></span>`; }
}

let storageAvailable = true;
async function checkStorage(){
  const el = document.getElementById('storageWarning');
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PEGA_TU_URL')===0){
    storageAvailable = false;
    if(el) el.innerHTML = `<div class="card rust"><h2>Falta conectar la base de datos</h2><p>Todavía no pegaste la URL de tu Google Apps Script en el código (buscá <b>APPS_SCRIPT_URL</b> cerca del principio del archivo). Hasta que la pegues, los equipos y el ranking no se van a guardar ni compartir entre nadie.</p></div>`;
    return;
  }
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=get&key=__ping__`);
    if(!res.ok) throw new Error('bad status');
    storageAvailable = true;
    if(el) el.innerHTML = '';
  }catch(e){
    storageAvailable = false;
    if(el) el.innerHTML = `<div class="card rust"><h2>No se pudo conectar con la base de datos</h2><p>Revisá que copiaste bien la URL de Apps Script y que la implementaste con acceso "Cualquier usuario". Mientras tanto los equipos y el ranking no se van a guardar.</p></div>`;
  }
}

/* ================= VISTA DE CARRERA PUNTUAL (?career=ID) ================= */
function renderCareerDetail(entry){
  const items = [];
  items.push({ic:'⚽🤝', text:`<b>${entry.goals} gol${entry.goals===1?'':'es'}</b> y <b>${entry.assists} asistencia${entry.assists===1?'':'s'}</b> en toda la carrera.`});
  items.push({ic:'🏆', text:`Títulos: <b>${entry.trophies.ligas}</b> ligas, <b>${entry.trophies.copas}</b> copas, <b>${entry.trophies.internacionales}</b> internacionales.`});
  if(entry.rivalName){
    items.push({ic:'⚡', text:`Duelo histórico vs <b>${entry.rivalName}</b> (${entry.rivalTeam||''}): terminó ${entry.playerTotal>=entry.rivalTotal?'ganando':'perdiendo'} ${entry.playerTotal}-${entry.rivalTotal} en goles+asistencias.`});
  }
  return `
    <div class="wrap" style="padding-top:20px;">
      <div class="card phase-in">
        <div class="season-eyebrow"><span>Ficha de carrera</span><span>Se retiró a los ${entry.retireAge}</span></div>
        <div class="season-headline">${entry.name}</div>
        <div class="season-sub">${posLabel(entry.position)} · ${entry.team} · <span class="tier-badge">${entry.tier}</span></div>
        <div class="season-grade"><span class="l">Puntos de Gloria</span><span class="n">${entry.score} ⭐</span></div>
        <div class="verdict-box good">${entry.flavor||''}</div>
        <div class="season-feed">
          ${items.map(it=>`<div class="season-feed-item"><div class="ic">${it.ic}</div><div>${it.text}</div></div>`).join('')}
        </div>
        ${renderPlayoffHistoryList(entry.playoffHistory)}
        <div class="btn-row"><button class="btn gold" onclick="window.location.search=''">Volver al juego</button></div>
      </div>
    </div>`;
}
async function tryRenderCareerFromUrl(){
  const id = new URLSearchParams(window.location.search).get('career');
  if(!id) return false;
  document.body.innerHTML = `<div class="wrap" style="padding-top:40px;"><div class="card"><div class="spinner-row"><div class="spinner"></div><span>Buscando esa carrera…</span></div></div></div>`;
  let raw;
  try{ raw = await remoteGet('leaderboard:'+id); }catch(e){ raw = null; }
  const entry = raw ? safeParse(raw,null) : null;
  if(!entry){
    document.body.innerHTML = `<div class="wrap" style="padding-top:40px;"><div class="card"><h2>No se encontró esa carrera</h2><div class="muted">Puede que el link esté mal, que la entrada se haya borrado, o que la base de datos no esté respondiendo.</div><div class="btn-row"><button class="btn gold" onclick="window.location.search=''">Volver al juego</button></div></div></div>`;
    return true;
  }
  document.body.innerHTML = renderCareerDetail(entry);
  return true;
}

/* ================= INIT ================= */
let leaderboardLoaded = false;
async function init(){
  try{
    const showedCareer = await tryRenderCareerFromUrl();
    if(showedCareer) return;
    document.getElementById('app').innerHTML = `<div class="card"><div class="spinner-row"><div class="spinner"></div><span>Cargando tu liga…</span></div></div>`;
    const timeout = new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), 15000));
    await Promise.race([ Promise.all([ checkStorage(), loadLeague(), loadActiveCareer(), loadHistory() ]), timeout ]);
    render();
    loadLeaderboard().then(()=>{
      leaderboardLoaded = true;
      if(tab==='ranking') render();
    }).catch(()=>{ leaderboardLoaded = true; if(tab==='ranking') render(); });
  }catch(e){
    console.error('Error al iniciar', e);
    const app = document.getElementById('app');
    if(app) app.innerHTML = `<div class="card rust"><h2>No se pudo cargar</h2><p class="muted">Algo falló al conectar con la base de datos (revisá la URL de Apps Script o tu conexión). Probá recargar la página.</p><div class="btn-row"><button class="btn gold" onclick="window.location.reload()">Recargar</button></div></div>`;
  }
}
init();
</script>
